    /* ─── FadingVideo ─── */
    function FadingVideo({ src, className = '', lazy = false }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const isFadingRef = useRef(false);
      const mountedRef = useRef(true);
      const [activeSrc, setActiveSrc] = useState(lazy ? null : src);

      const cancelFade = useCallback(() => {
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        isFadingRef.current = false;
      }, []);

      const fadeTo = useCallback((targetOpacity, duration = 400) => {
        const video = videoRef.current;
        if (!video || !mountedRef.current) return;
        cancelFade();
        isFadingRef.current = true;
        const startOpacity = parseFloat(video.style.opacity || '1');
        const startTime = performance.now();
        const animate = (now) => {
          if (!mountedRef.current || !video) return;
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          video.style.opacity = String(startOpacity + (targetOpacity - startOpacity) * eased);
          if (progress < 1) rafRef.current = requestAnimationFrame(animate);
          else { isFadingRef.current = false; rafRef.current = null; }
        };
        rafRef.current = requestAnimationFrame(animate);
      }, [cancelFade]);

      useEffect(() => {
        mountedRef.current = true;
        const video = videoRef.current;
        if (!video) return;

        // Lazy: only assign src when in view (faster first paint)
        let observer;
        if (lazy && 'IntersectionObserver' in window) {
          observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setActiveSrc(src);
                observer.disconnect();
              }
            },
            { rootMargin: '200px', threshold: 0.01 }
          );
          observer.observe(video);
        } else if (!lazy) {
          setActiveSrc(src);
        }

        return () => {
          mountedRef.current = false;
          cancelFade();
          if (observer) observer.disconnect();
        };
      }, [src, lazy, cancelFade]);

      useEffect(() => {
        const video = videoRef.current;
        if (!video || !activeSrc) return;
        video.style.opacity = '1';

        const onTimeUpdate = () => {
          if (!video.duration || isFadingRef.current) return;
          if (video.duration - video.currentTime <= 0.55 && video.duration - video.currentTime > 0) fadeTo(0, 400);
        };
        const onEnded = () => {
          cancelFade();
          video.currentTime = 0;
          video.play().catch(() => {});
          requestAnimationFrame(() => { if (mountedRef.current) fadeTo(1, 400); });
        };
        const onLoaded = () => video.play().catch(() => {});

        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('ended', onEnded);
        video.addEventListener('loadeddata', onLoaded);
        video.play().catch(() => {});

        return () => {
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('ended', onEnded);
          video.removeEventListener('loadeddata', onLoaded);
          video.pause();
        };
      }, [activeSrc, fadeTo, cancelFade]);

      return (
        <video
          ref={videoRef}
          src={activeSrc || undefined}
          className={`video-mono absolute inset-0 w-full h-full object-cover ${className}`}
          autoPlay
          muted
          playsInline
          preload={lazy ? 'none' : 'metadata'}
          loop={false}
          style={{ opacity: 1, background: '#000' }}
        />
      );
    }

    function ProjectModal({ project, image, onClose }) {
      const [copied, setCopied] = useState(false);
      const loadstringCode = project?.scriptUrl
        ? `loadstring(game:HttpGet("${project.scriptUrl}"))()`
        : '';

      useEffect(() => {
        if (!project) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', onKey);
        return () => {
          document.body.style.overflow = '';
          window.removeEventListener('keydown', onKey);
        };
      }, [project, onClose]);

      useEffect(() => {
        setCopied(false);
      }, [project]);

      if (!project) return null;

      const copyCode = async () => {
        if (!loadstringCode) return;
        try {
          await navigator.clipboard.writeText(loadstringCode);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = loadstringCode;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-6" role="dialog" aria-modal="true">

            </motion.h2>
            <motion.p initial={{ opacity: 0, y: 16 }} animate={inView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.7, delay: 0.15 }} className="mt-5 text-base sm:text-lg text-white/55 font-light">
              Neo Studio is always building the next thing.
            </motion.p>
          </div>
        </section>
      );
    }

    /* ─── Community: Discord + Staff ─── */
    function CommunitySection() {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, margin: '-80px' });
      const [stats, setStats] = useState({
        name: null,
        total: null,
        online: null,
        offline: null,
      });

      useEffect(() => {
        let cancelled = false;
        const inviteCode = (DISCORD_URL.split('/').pop() || '').split('?')[0];
        fetch(`https://discord.com/api/v10/invites/${inviteCode}?with_counts=true`)
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((data) => {
            if (cancelled) return;
            const total = data.approximate_member_count ?? null;
            const online = data.approximate_presence_count ?? null;
            const offline =
              total !== null && online !== null ? Math.max(total - online, 0) : null;
            setStats({
              name: data.guild?.name || null,
              total,
              online,
              offline,
            });
          })
          .catch(() => {});
        return () => { cancelled = true; };
      }, []);

      const total = stats.total || 0;
      const online = stats.online || 0;
      const offline = stats.offline || 0;
      const onlinePct = total > 0 ? Math.round((online / total) * 100) : 0;
      const offlinePct = total > 0 ? Math.round((offline / total) * 100) : 0;

      // Simple visual bars (relative scale for chart aesthetic)
      const maxBar = Math.max(total, online, offline, 1);

      return (
        <section id="community" className="relative py-24 sm:py-32 bg-[#000]">
          <div className="mx-auto max-w-6xl px-6" ref={ref}>
            <motion.div
              initial={{ opacity: 0, y: 24, filter: 'blur(8px)' }}
              animate={inView ? { opacity: 1, y: 0, filter: 'blur(0px)' } : {}}
              transition={{ duration: 0.7 }}
              className="text-center mb-14"
            >
              <p className="text-xs tracking-[0.25em] uppercase text-white/40 mb-4">Community</p>
              <h2 className="font-serif text-3xl sm:text-5xl italic text-white tracking-tight">Discord & Team</h2>
              <p className="mt-5 max-w-lg mx-auto text-base sm:text-lg text-white/50 font-light">
                Live server numbers from Discord — and the assistants behind Neo Studio.
              </p>
            </motion.div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
              {/* Stats + chart */}
              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={inView ? { opacity: 1, y: 0 } : {}}
                transition={{ delay: 0.1, duration: 0.55 }}
                className="liquid-glass-strong rounded-3xl p-6 sm:p-8"
              >
                <div className="flex items-center gap-3 mb-8">
                  <div className="w-11 h-11 rounded-xl liquid-glass flex items-center justify-center">
                    <DiscordIcon className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <p className="text-sm font-medium text-white">
                      {stats.name || 'Neo Studio Discord'}
                    </p>
                    <p className="text-xs text-white/40 mt-0.5">Live from Discord API</p>
                  </div>
                </div>

                {/* Three numbers */}
                <div className="grid grid-cols-3 gap-3 mb-8">
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] px-3 py-4 text-center">
                    <p className="text-[10px] tracking-[0.15em] uppercase text-white/35">Members</p>
                    <p className="mt-1 font-serif text-2xl sm:text-3xl italic text-white">
                      {stats.total !== null ? stats.total.toLocaleString() : '—'}
                    </p>
                  </div>
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] px-3 py-4 text-center">
                    <p className="text-[10px] tracking-[0.15em] uppercase text-white/35">Online</p>
                    <p className="mt-1 font-serif text-2xl sm:text-3xl italic text-white">
                      {stats.online !== null ? stats.online.toLocaleString() : '—'}
                    </p>
                  </div>
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] px-3 py-4 text-center">
                    <p className="text-[10px] tracking-[0.15em] uppercase text-white/35">Offline</p>
                    <p className="mt-1 font-serif text-2xl sm:text-3xl italic text-white">
                      {stats.offline !== null ? stats.offline.toLocaleString() : '—'}
                    </p>
                  </div>
                </div>

                {/* Chart: distribution */}
                <div className="rounded-2xl border border-white/10 bg-white/[0.02] p-5 mb-6">
                  <div className="flex items-center justify-between mb-4">
                    <p className="text-[10px] tracking-[0.2em] uppercase text-white/40">Activity split</p>
                    <p className="text-xs text-white/35">{onlinePct}% online</p>
                  </div>

                  {/* Stacked bar */}
                  <div className="h-3 rounded-full overflow-hidden bg-white/10 flex mb-5">
                    <div
                      className="h-full bg-white transition-all duration-1000"
                      style={{ width: `${onlinePct}%` }}
                    />
                    <div
                      className="h-full bg-white/25 transition-all duration-1000"
                      style={{ width: `${offlinePct}%` }}
                    />
                  </div>

                  {/* Horizontal comparison bars */}
                  <div className="space-y-3">
                    {[
                      { label: 'Members', value: total, tone: 'bg-white' },
                      { label: 'Online', value: online, tone: 'bg-white/80' },
                      { label: 'Offline', value: offline, tone: 'bg-white/35' },
                    ].map((row) => (
                      <div key={row.label}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-white/45">{row.label}</span>
                          <span className="text-white/70 tabular-nums">
                            {row.value ? row.value.toLocaleString() : '—'}
                          </span>
                        </div>
                        <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                          <div
                            className={`h-full rounded-full ${row.tone} transition-all duration-1000`}
                            style={{ width: `${Math.max((row.value / maxBar) * 100, row.value ? 2 : 0)}%` }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <a
                  href={DISCORD_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex w-full items-center justify-center gap-2 rounded-full bg-white text-black px-6 py-3 text-sm font-medium tracking-wide hover:bg-white/90 transition-colors"
                >
                  <DiscordIcon className="w-4 h-4" />
                  Join Discord ↗
                </a>
              </motion.div>

              {/* Staff */}
              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={inView ? { opacity: 1, y: 0 } : {}}
                transition={{ delay: 0.18, duration: 0.55 }}
                className="liquid-glass rounded-3xl p-6 sm:p-8"
              >
                <p className="text-[10px] tracking-[0.25em] uppercase text-white/40 mb-2">Team</p>
                <h3 className="font-serif text-2xl sm:text-3xl italic text-white mb-2">Assistants</h3>
                <p className="text-sm text-white/45 font-light mb-8">
                  Tap a person to open their Discord profile.
                </p>

                <ul className="space-y-3">
                  {STAFF.map((person, i) => {
                    const profileUrl = person.id
                      ? `https://discord.com/users/${person.id}`
                      : DISCORD_URL;
                    let avatarUrl = person.avatar || null;
                    if (!avatarUrl && person.id) {
                      try {
                        const idx = Number((BigInt(person.id) >> 22n) % 6n);
                        avatarUrl = `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
                      } catch (e) {
                        avatarUrl = null;
                      }
                    }

                    return (
                      <li key={`${person.username}-${i}`}>
                        <a
                          href={profileUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex items-center gap-4 rounded-2xl border border-white/10 bg-white/[0.02] px-4 py-3 hover:border-white/25 hover:bg-white/[0.05] transition-colors group"
                        >
                          <div className="w-12 h-12 rounded-full overflow-hidden border border-white/15 bg-[#111] shrink-0 flex items-center justify-center">
                            {avatarUrl ? (
                              <img
                                src={avatarUrl}
                                alt={person.display || person.username}
                                className="w-full h-full object-cover img-mono"
                                onError={(e) => {
                                  e.target.style.display = 'none';
                                  if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                                }}
                              />
                            ) : null}
                            <span
                              className="font-serif text-lg italic text-white/50"
                              style={{ display: avatarUrl ? 'none' : 'flex' }}
                            >
                              {(person.display || person.username || '?').charAt(0).toUpperCase()}
                            </span>
                          </div>
                          <div className="min-w-0 flex-1">
                            <p className="text-sm font-medium text-white truncate group-hover:text-white">
                              {person.display || person.username}
                            </p>
                            <p className="text-xs text-white/40 mt-0.5 truncate">@{person.username}</p>
                          </div>
                          <span className="text-[10px] tracking-[0.12em] uppercase text-white/35 border border-white/12 rounded-full px-2.5 py-1 shrink-0">
                            {person.role || 'Staff'}
                          </span>
                          <span className="text-white/30 group-hover:text-white/60 transition-colors text-sm">↗</span>
                        </a>
                      </li>
                    );
                  })}
                </ul>
              </motion.div>
            </div>
          </div>
        </section>
      );
    }

    /* ─── Final CTA ─── */
    function FinalCTA() {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, margin: '-80px' });
      return (
        <section className="relative min-h-[60vh] sm:min-h-[70vh] flex items-center justify-center overflow-hidden">
          <div className="absolute inset-0">
            <FadingVideo src={VIDEOS.final} lazy />
            <div className="absolute inset-0 bg-black/65" />
            <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40" />
          </div>
          <div className="relative z-10 mx-auto max-w-3xl px-6 text-center" ref={ref}>
            <motion.h2 initial={{ opacity: 0, y: 20, filter: 'blur(10px)' }} animate={inView ? { opacity: 1, y: 0, filter: 'blur(0px)' } : {}} transition={{ duration: 0.8 }} className="font-serif text-3xl sm:text-5xl md:text-6xl italic text-white tracking-tight">
              See what we build next.
            </motion.h2>
            <motion.p initial={{ opacity: 0, y: 14 }} animate={inView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.65, delay: 0.12 }} className="mt-5 text-white/55 font-light text-base sm:text-lg">
              More projects are already in development.
            </motion.p>
            <motion.div initial={{ opacity: 0, y: 14 }} animate={inView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.65, delay: 0.22 }} className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
              <a href="#projects" className="inline-flex items-center gap-2 rounded-full bg-white text-black px-7 py-3.5 text-sm font-medium tracking-wide hover:bg-white/90 transition-colors">Explore Projects</a>
              <a href={DISCORD_URL} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 rounded-full liquid-glass px-7 py-3.5 text-sm font-medium tracking-wide text-white hover:bg-white/10 transition-colors">Join Discord</a>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ─── Footer ─── */
    function Footer() {
      return (
        <footer className="relative border-t border-white/10 bg-[#000] py-14 sm:py-16">
          <div className="mx-auto max-w-6xl px-6">
            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-10">
              <div>
                <p className="font-serif text-xl text-white tracking-wide">NEO STUDIO</p>
                <p className="mt-1 text-[10px] tracking-[0.25em] uppercase text-white/40">By MITTO</p>
                <p className="mt-4 text-sm text-white/40 font-light max-w-xs">BUILD. CREATE. EVOLVE.</p>
              </div>
              <div className="flex flex-wrap gap-x-10 gap-y-6">
                <div>
                  <p className="text-[10px] tracking-[0.2em] uppercase text-white/30 mb-3">Navigate</p>
                  <ul className="space-y-2">
                    {['Home', 'Profile', 'Projects', 'Community', 'About', 'Studio'].map((label) => (
                      <li key={label}><a href={`#${label.toLowerCase()}`} className="text-sm text-white/55 hover:text-white transition-colors">{label}</a></li>
                    ))}
                  </ul>
                </div>
                <div>
                  <p className="text-[10px] tracking-[0.2em] uppercase text-white/30 mb-3">Community</p>
                  <ul className="space-y-2">
                    <li><a href={DISCORD_URL} target="_blank" rel="noopener noreferrer" className="text-sm text-white/55 hover:text-white transition-colors">Discord</a></li>
                  </ul>
                </div>
                <div>
                  <p className="text-[10px] tracking-[0.2em] uppercase text-white/30 mb-3">Projects</p>
                  <ul className="space-y-2">
                    {['Neo-EVADE', 'Neo-FATS', 'Neo-Blade-Ball', 'Neo-Universal'].map((name) => (
                      <li key={name}><a href="#projects" className="text-sm text-white/55 hover:text-white transition-colors">{name}</a></li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
            <div className="mt-12 pt-8 border-t border-white/8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <p className="text-xs text-white/30">© 2026 Neo Studio. All rights reserved.</p>
              <p className="text-xs text-white/25 tracking-wide">Independent creative technology studio</p>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <div className="min-h-screen bg-black text-white font-sans">
          <Navbar />
          <main>
            <Hero />
            <Stats />
            <ProfileBanner />
            <Projects />
            <About />
            <Process />
            <CinematicBreak />
            <CommunitySection />
            <FinalCTA />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
